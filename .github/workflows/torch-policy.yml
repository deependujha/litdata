name: PyTorch support policy

# Watches for new PyTorch releases and files an issue when .github/torch-support.json falls behind.
# It opens an issue rather than a pull request because creating pull requests from `GITHUB_TOKEN`
# is disabled for this organization; `issues: write` is not. Regular pull requests are never failed
# by a fresh PyTorch release — they only validate the policy file (see ci-testing.yml).

on:
  schedule:
    # every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  check-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare the policy against PyPI
        id: bump
        run: python3 .github/scripts/torch_support.py bump --dry-run

      - name: File an issue
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST: ${{ steps.bump.outputs.latest }}
          PREVIOUS: ${{ steps.bump.outputs.previous }}
        run: |
          TITLE="Support PyTorch ${LATEST}"
          if [ -n "$(gh issue list --state all --search "\"${TITLE}\" in:title" --json number --jq '.[].number')" ]; then
            echo "an issue for PyTorch ${LATEST} already exists — nothing to do"
            exit 0
          fi
          gh issue create --title "$TITLE" --body "PyTorch ${LATEST} is out, so the supported releases become
          **${LATEST}** and **${PREVIOUS}**.

          To move them, run:

          \`\`\`bash
          python3 .github/scripts/torch_support.py bump
          \`\`\`

          That updates \`.github/torch-support.json\` and the versions the README announces; the CI matrix reads the
          same file, so nothing else needs touching. Review whether \`minimum\` (the \`torch\` lower bound in
          \`requirements.txt\`) should move as well — that stays a deliberate call, and dependabot is configured to
          leave it alone.

          Filed by [\`torch-policy.yml\`](.github/workflows/torch-policy.yml)."
